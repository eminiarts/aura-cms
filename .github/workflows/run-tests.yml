name: tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  frontend-compatibility:
    name: Frontend compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/Fixtures/FrontendCompatibility/v4/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify frontend compatibility
        run: npm run test:frontend-compatibility

  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Select Laravel version
        run: composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests in parallel
        run: composer test

  laravel-12-floor:
    name: Laravel 12.0.1 floor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Select Laravel 12.0.1 test stack
        run: |
          composer remove pestphp/pest-plugin-browser pestphp/pest-plugin-livewire --dev --no-interaction --no-update
          composer require "laravel/framework:12.0.1" "orchestra/testbench:10.0.0" "pestphp/pest:^3.7.4" "pestphp/pest-plugin-laravel:3.1.0" --dev --no-interaction --no-update

      - name: Install dependencies
        run: composer update --with-all-dependencies --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Verify exact Laravel floor
        run: composer show laravel/framework --format=json | grep -Fq '"v12.0.1"'

      - name: Run compatibility regressions
        run: |
          php -d memory_limit=1G -d error_reporting=6143 vendor/bin/pest --no-coverage \
            tests/Feature/Aura/SupportMatrixTest.php \
            tests/Feature/NavigationTest.php \
            tests/Feature/OptionCacheTest.php \
            --filter='rollback cleanup|team option reads require|teamless user option reads|navigation accepts a legitimate|navigation fails closed|membership pivot lifecycle|role-side user membership|role-side team attach detach|user-side sync removals|role-side bulk detach|pivot-constrained detach preserves|membership detach invalidation|membership detach closes|support matrix|pins the Laravel 12 floor'

  teams-off:
    name: Teams-off
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run teams-off suite
        run: php -d memory_limit=1G vendor/bin/pest --no-coverage -c phpunit-without-teams.xml

  livewire-compatibility:
    name: Livewire ${{ matrix.livewire }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        livewire: ['4.3.5', '~4.3.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Select Livewire version
        run: composer require "livewire/livewire:${{ matrix.livewire }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update livewire/livewire --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Run Livewire adapter and collision matrix
        run: php -d memory_limit=1G vendor/bin/pest --no-coverage tests/Feature/Livewire/Livewire43CollisionInspectorTest.php tests/Feature/Livewire/ComponentSlotProviderTest.php

  database-guards:
    name: Embedded guards / SQLite, MySQL, MariaDB, PostgreSQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aura_core12_guard_test
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: aura_core12_guard_test
          MARIADB_ROOT_PASSWORD: test-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aura_core12_guard_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run database guard contract tests
        env:
          AURA_TEST_DATABASE_GUARDS: '1'
          AURA_TEST_MYSQL_DATABASE: aura_core12_guard_test
          AURA_TEST_MYSQL_HOST: 127.0.0.1
          AURA_TEST_MYSQL_PASSWORD: test-password
          AURA_TEST_MYSQL_PORT: '3306'
          AURA_TEST_MYSQL_USERNAME: root
          AURA_TEST_MARIADB_DATABASE: aura_core12_guard_test
          AURA_TEST_MARIADB_HOST: 127.0.0.1
          AURA_TEST_MARIADB_PASSWORD: test-password
          AURA_TEST_MARIADB_PORT: '3307'
          AURA_TEST_MARIADB_USERNAME: root
          AURA_TEST_PGSQL_DATABASE: aura_core12_guard_test
          AURA_TEST_PGSQL_HOST: 127.0.0.1
          AURA_TEST_PGSQL_PASSWORD: test-password
          AURA_TEST_PGSQL_PORT: '5432'
          AURA_TEST_PGSQL_USERNAME: postgres
        run: vendor/bin/pest --no-coverage --group=database-guards

  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run browser tests
        run: php -d memory_limit=1G vendor/bin/pest --testsuite Browser --no-coverage

      - name: Run replacement and timeout slot browser contract
        env:
          AURA_BROWSER_SELECTION_TTL: '1'
          AURA_BROWSER_SLOT_REPLACEMENTS: 'true'
        run: php -d memory_limit=1G vendor/bin/pest --no-coverage tests/Browser/ComponentSlotTest.php

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore

  fresh-install:
    name: Fresh Laravel install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, intl, gd, fileinfo
          coverage: none

      - name: Create Laravel application
        run: composer create-project laravel/laravel:^13.0 "$RUNNER_TEMP/aura-app" --no-interaction --prefer-dist

      - name: Install Aura from checkout
        working-directory: ${{ runner.temp }}/aura-app
        run: |
          composer config repositories.aura path "$GITHUB_WORKSPACE"
          composer require eminiarts/aura-cms:@dev --with-all-dependencies --no-interaction
          php artisan vendor:publish --tag=aura-config --force
          php artisan aura:install-config --no-interaction
          php artisan aura:extend-user-model --no-interaction
          php artisan vendor:publish --tag=aura-migrations --force
          php artisan migrate --force
          php artisan aura:publish
          php artisan aura:user --name="CI Admin" --email="ci@example.com" --password="CI-Test-Password-2026!"
          php artisan about
