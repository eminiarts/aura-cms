name: tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Select Laravel version
        run: composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests in parallel
        run: php -d memory_limit=1G vendor/bin/pest --no-coverage --parallel --exclude-testsuite Browser

  teams-off:
    name: Teams-off
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run teams-off suite
        run: php -d memory_limit=1G vendor/bin/pest --no-coverage -c phpunit-without-teams.xml

  database-guards:
    name: Embedded guards / MySQL and PostgreSQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aura_core12_guard_test
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aura_core12_guard_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo_mysql, pdo_pgsql, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run database guard contract tests
        env:
          AURA_TEST_DATABASE_GUARDS: '1'
          AURA_TEST_MYSQL_DATABASE: aura_core12_guard_test
          AURA_TEST_MYSQL_HOST: 127.0.0.1
          AURA_TEST_MYSQL_PASSWORD: test-password
          AURA_TEST_MYSQL_PORT: '3306'
          AURA_TEST_MYSQL_USERNAME: root
          AURA_TEST_PGSQL_DATABASE: aura_core12_guard_test
          AURA_TEST_PGSQL_HOST: 127.0.0.1
          AURA_TEST_PGSQL_PASSWORD: test-password
          AURA_TEST_PGSQL_PORT: '5432'
          AURA_TEST_PGSQL_USERNAME: postgres
        run: vendor/bin/pest --no-coverage --group=database-guards

  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run browser tests
        run: php -d memory_limit=1G vendor/bin/pest --testsuite Browser --no-coverage

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore

  fresh-install:
    name: Fresh Laravel install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, intl, gd, fileinfo
          coverage: none

      - name: Create Laravel application
        run: composer create-project laravel/laravel:^13.0 "$RUNNER_TEMP/aura-app" --no-interaction --prefer-dist

      - name: Install Aura from checkout
        working-directory: ${{ runner.temp }}/aura-app
        run: |
          composer config repositories.aura path "$GITHUB_WORKSPACE"
          composer require eminiarts/aura-cms:@dev --with-all-dependencies --no-interaction
          php artisan vendor:publish --tag=aura-config --force
          php artisan aura:install-config --no-interaction
          php artisan aura:extend-user-model --no-interaction
          php artisan vendor:publish --tag=aura-migrations --force
          php artisan migrate --force
          php artisan aura:publish
          php artisan aura:user --name="CI Admin" --email="ci@example.com" --password="CI-Test-Password-2026!"
          php artisan about
