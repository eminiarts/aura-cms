name: tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  frontend-compatibility:
    name: Frontend compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/Fixtures/FrontendCompatibility/v4/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify frontend compatibility
        run: npm run test:frontend-compatibility

  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Select Laravel version
        run: composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests in parallel
        run: php -d memory_limit=1G vendor/bin/pest --no-coverage --parallel --exclude-testsuite Browser

  laravel-12-floor:
    name: Laravel 12.0.1 floor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Select Laravel 12.0.1 test stack
        run: |
          composer remove pestphp/pest-plugin-browser pestphp/pest-plugin-livewire --dev --no-interaction --no-update
          composer require "laravel/framework:12.0.1" "orchestra/testbench:10.0.0" "pestphp/pest:^3.7.4" "pestphp/pest-plugin-laravel:3.1.0" --dev --no-interaction --no-update

      - name: Install dependencies
        run: composer update --with-all-dependencies --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Verify exact Laravel floor
        run: composer show laravel/framework --format=json | grep -Fq '"v12.0.1"'

      - name: Run compatibility regressions
        run: |
          php -d memory_limit=1G -d error_reporting=6143 vendor/bin/pest --no-coverage \
            tests/Feature/Aura/SupportMatrixTest.php \
            tests/Feature/NavigationTest.php \
            tests/Feature/OptionCacheTest.php \
            --filter='rollback cleanup|team option reads require|teamless user option reads|navigation accepts a legitimate|navigation fails closed|membership pivot lifecycle|role-side user membership|role-side team attach detach|user-side sync removals|role-side bulk detach|pivot-constrained detach preserves|membership detach invalidation|membership detach closes|support matrix|pins the Laravel 12 floor'

  teams-off:
    name: Teams-off
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run teams-off suite
        run: php -d memory_limit=1G vendor/bin/pest --no-coverage -c phpunit-without-teams.xml

  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run browser tests
        run: php -d memory_limit=1G vendor/bin/pest --testsuite Browser --no-coverage

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore

  fresh-install:
    name: Fresh Laravel install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, intl, gd, fileinfo
          coverage: none

      - name: Create Laravel application
        run: composer create-project laravel/laravel:^13.0 "$RUNNER_TEMP/aura-app" --no-interaction --prefer-dist

      - name: Install Aura from checkout
        working-directory: ${{ runner.temp }}/aura-app
        run: |
          composer config repositories.aura path "$GITHUB_WORKSPACE"
          composer require eminiarts/aura-cms:@dev --with-all-dependencies --no-interaction
          php artisan vendor:publish --tag=aura-config --force
          php artisan aura:install-config --no-interaction
          php artisan aura:extend-user-model --no-interaction
          php artisan vendor:publish --tag=aura-migrations --force
          php artisan migrate --force
          php artisan aura:publish
          php artisan aura:user --name="CI Admin" --email="ci@example.com" --password="CI-Test-Password-2026!"
          php artisan about
